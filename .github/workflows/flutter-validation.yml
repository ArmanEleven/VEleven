name: Flutter validation

on:
  push:
    branches:
      - feat/xray-engine-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          architecture: x64
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub
