name: V11 Development APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build arm64 test APK (DXcore debug stub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          architecture: x64
          cache: false

      - name: Install Android NDK
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13846066"
          echo "ndk.dir=${ANDROID_HOME}/ndk/29.0.13846066" > android/local.properties

      - name: Download pinned Xray Android core
        run: |
          curl -fL --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar" \
            -o android/app/libs/libv2ray.aar
          test -s android/app/libs/libv2ray.aar

      - name: Download DXcore and inspect AAR compatibility
        env:
          DXCORE_PRIVATE_ACCESS_TOKEN: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DXCORE_PRIVATE_ACCESS_TOKEN" || {
            echo "DXCORE_PRIVATE_ACCESS_TOKEN is missing or empty."
            exit 1
          }

          RELEASE_JSON="$RUNNER_TEMP/dxcore-release.json"
          PACKAGE_DIR="$RUNNER_TEMP/dxcore-package"
          INSPECT_DIR="$RUNNER_TEMP/aar-inspection"
          mkdir -p "$PACKAGE_DIR" "$INSPECT_DIR" android/app/libs

          curl -fLsS \
            -H "Authorization: token $DXCORE_PRIVATE_ACCESS_TOKEN" \
            "https://api.github.com/repos/UnboundTechCo/DXcore-private/releases/latest" \
            -o "$RELEASE_JSON"

          ASSET_ID="$(jq -r '.assets[]? | select(.name == "DXcore-android.zip") | .id' "$RELEASE_JSON")"
          test -n "$ASSET_ID" && test "$ASSET_ID" != "null" || {
            echo "DXcore-android.zip was not found in the latest private release."
            exit 1
          }

          curl -fLsS -L \
            -H "Authorization: token $DXCORE_PRIVATE_ACCESS_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/UnboundTechCo/DXcore-private/releases/assets/$ASSET_ID" \
            -o "$RUNNER_TEMP/DXcore-android.zip"

          unzip -q -o "$RUNNER_TEMP/DXcore-android.zip" -d "$PACKAGE_DIR"
          test -d "$PACKAGE_DIR/build/android" || {
            echo "Expected build/android directory was not present in the DXcore package."
            find "$PACKAGE_DIR" -maxdepth 4 -type f | head -80
            exit 1
          }
          cp -a "$PACKAGE_DIR/build/android/." android/app/libs/
          DXCORE_AAR="android/app/libs/DXcore.aar"
          XRAY_AAR="android/app/libs/libv2ray.aar"
          test -s "$DXCORE_AAR"
          test -s "$XRAY_AAR"

          mkdir -p "$INSPECT_DIR/dxcore" "$INSPECT_DIR/xray"
          unzip -p "$DXCORE_AAR" classes.jar > "$INSPECT_DIR/dxcore/classes.jar"
          unzip -p "$XRAY_AAR" classes.jar > "$INSPECT_DIR/xray/classes.jar"
          jar tf "$INSPECT_DIR/dxcore/classes.jar" | sort -u > "$INSPECT_DIR/dxcore/classes.txt"
          jar tf "$INSPECT_DIR/xray/classes.jar" | sort -u > "$INSPECT_DIR/xray/classes.txt"
          comm -12 "$INSPECT_DIR/dxcore/classes.txt" "$INSPECT_DIR/xray/classes.txt" > "$INSPECT_DIR/duplicate-classes.txt"

          {
            echo "## DXcore / Xray AAR compatibility inspection"
            echo
            echo "- DXcore AAR size: $(stat -c '%s' "$DXCORE_AAR") bytes"
            echo "- Xray AAR size: $(stat -c '%s' "$XRAY_AAR") bytes"
            echo "- DXcore Java classes: $(wc -l < "$INSPECT_DIR/dxcore/classes.txt" | tr -d ' ')"
            echo "- Xray Java classes: $(wc -l < "$INSPECT_DIR/xray/classes.txt" | tr -d ' ')"
            echo "- Duplicate Java classes: $(wc -l < "$INSPECT_DIR/duplicate-classes.txt" | tr -d ' ')"
            echo
            echo "### Duplicate class names (first 100)"
            if test -s "$INSPECT_DIR/duplicate-classes.txt"; then
              sed -n '1,100p' "$INSPECT_DIR/duplicate-classes.txt"
            else
              echo "None"
            fi
            echo
            echo "### Native library entries"
            for AAR in "$DXCORE_AAR" "$XRAY_AAR"; do
              echo "- $(basename "$AAR"):"
              unzip -Z1 "$AAR" | grep -E '^jni/[^/]+/[^/]+[.]so || true
            done
            echo
            echo "### arm64 libgojni fingerprints"
            for NAME in dxcore xray; do
              AAR="$DXCORE_AAR"
              test "$NAME" = "xray" && AAR="$XRAY_AAR"
              ENTRY="$(unzip -Z1 "$AAR" | grep -E '^jni/arm64-v8a/libgojni[.]so | head -1 || true)"
              if test -n "$ENTRY"; then
                unzip -p "$AAR" "$ENTRY" > "$INSPECT_DIR/$NAME/libgojni.so"
                echo "- $NAME: $(sha256sum "$INSPECT_DIR/$NAME/libgojni.so" | awk '{print $1}')"
              else
                echo "- $NAME: no arm64 libgojni.so entry"
              fi
            done
            echo
            echo "### Go binding classes"
            for CLASS in go/Seq.class go/Go.class android/Android.class libv2ray/Libv2ray.class; do
              printf '%s: ' "$CLASS"
              for NAME in dxcore xray; do
                grep -Fxq "$CLASS" "$INSPECT_DIR/$NAME/classes.txt" && printf '%s=present ' "$NAME" || printf '%s=absent ' "$NAME"
              done
              echo
            done
          } | tee "$INSPECT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate environment file
        uses: ./.github/actions/create-env
        with:
          secret_blob: ${{ toJson(secrets) }}
          var_blob: ${{ toJson(vars) }}
          os_name: android

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare writable Android debug signing directory
        run: |
          mkdir -p "$RUNNER_TEMP/.android"
          chmod 700 "$RUNNER_TEMP/.android"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/.android" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64 --verbose

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: VELEVEN-V11-test-arm64-DXcore-DEBUG-STUB
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 || true
