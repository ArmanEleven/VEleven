name: Validate VELEVEN Xray integration

on:
  push:
    branches:
      - feat/xray-engine-integration
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/xray-validation.yml"
      - ".github/workflows/v11-test-apk.yml"

permissions:
  contents: read

jobs:
  test-apk:
    uses: ./.github/workflows/v11-test-apk.yml
    secrets: inherit
